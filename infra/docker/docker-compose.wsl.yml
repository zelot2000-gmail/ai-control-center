networks:
  ai_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  hf_cache:

x-common: &common
  restart: unless-stopped
  networks:
    - ai_net

services:

  # ─── Databases ────────────────────────────────────────────────────────────

  postgres:
    <<: *common
    image: postgres:16-alpine
    container_name: aicc-postgres
    profiles: [core]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aicc}
      POSTGRES_USER: ${POSTGRES_USER:-aicc_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aicc_user} -d ${POSTGRES_DB:-aicc}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    <<: *common
    image: redis:7-alpine
    container_name: aicc-redis
    profiles: [core]
    command: redis-server --requirepass ${REDIS_PASSWORD:-change_me}
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-change_me}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    <<: *common
    image: qdrant/qdrant:v1.9.2
    container_name: aicc-qdrant
    profiles: [core]
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "127.0.0.1:6333:6333"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/6333' 2>/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ─── Core Services ────────────────────────────────────────────────────────

  mobile-gateway:
    <<: *common
    build:
      context: ../../services/mobile-gateway
      dockerfile: Dockerfile
    container_name: aicc-mobile-gateway
    profiles: [core]
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-wsl}
      - TTO_URL=http://tto-api:8091
      - MOBILE_GATEWAY_SECRET=${MOBILE_GATEWAY_SECRET:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ../../data:/app/data
    ports:
      - "127.0.0.1:8088:8088"
    depends_on:
      - tto-api
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8088/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  rag-api:
    <<: *common
    build:
      context: ../../services/rag-api
      dockerfile: Dockerfile
    container_name: aicc-rag-api
    profiles: [core]
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - QDRANT_COLLECTION=${QDRANT_COLLECTION:-aicc_docs}
      - QDRANT_WIKI_COLLECTION=${QDRANT_WIKI_COLLECTION:-aicc_wiki}
      - RAG_EMBEDDING_MODEL=${RAG_EMBEDDING_MODEL:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ../../data:/app/data
      - ../../docs:/app/docs:ro
      - hf_cache:/app/.cache/huggingface
    ports:
      - "127.0.0.1:8090:8090"
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health')"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  tto-api:
    <<: *common
    build:
      context: ../../services/tto-api
      dockerfile: Dockerfile
    container_name: aicc-tto-api
    profiles: [core]
    environment:
      - TTO_MAX_INPUT_LENGTH=${TTO_MAX_INPUT_LENGTH:-32000}
      - TTO_CLI_PATH=${TTO_CLI_PATH:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    ports:
      - "127.0.0.1:8091:8091"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8091/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  rtk-bridge:
    <<: *common
    build:
      context: ../../services/rtk-bridge
      dockerfile: Dockerfile
    container_name: aicc-rtk-bridge
    profiles: [core]
    environment:
      - RTK_ALLOW_RUN_COMMAND=${RTK_ALLOW_RUN_COMMAND:-false}
      - RTK_WORKSPACE=${RTK_WORKSPACE:-/workspace}
      - RTK_CLI_PATH=${RTK_CLI_PATH:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ../../data:/workspace
    ports:
      - "127.0.0.1:8092:8092"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8092/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  worker:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    <<: *common
    build:
      context: ../../services/worker
      dockerfile: Dockerfile
    container_name: aicc-worker
    profiles: [core]
    environment:
      - HERMES_CLI_PATH=${HERMES_CLI_PATH:-}
      - AGENTUNIVERSE_CLI_PATH=${AGENTUNIVERSE_CLI_PATH:-}
      - MOBILE_GATEWAY_URL=${MOBILE_GATEWAY_URL:-http://mobile-gateway:8088}
      - RAG_API_URL=${RAG_API_URL:-http://rag-api:8090}
      - AGENT_RUNNER_ENABLED=${AGENT_RUNNER_ENABLED:-false}
      - AGENT_RUNNER_MODE=${AGENT_RUNNER_MODE:-prompt_only}
      - HERMES_API_URL=${HERMES_API_URL:-}
      - HERMES_API_KEY=${HERMES_API_KEY:-}
      - HERMES_TIMEOUT_MS=${HERMES_TIMEOUT_MS:-120000}
      - HERMES_TIMEOUT_SECONDS=${HERMES_TIMEOUT_SECONDS:-120}
      - HERMES_FALLBACK_MODE=${HERMES_FALLBACK_MODE:-hermes_manual}
      - HERMES_RETRY_ATTEMPTS=${HERMES_RETRY_ATTEMPTS:-1}
      - HERMES_RETRY_BACKOFF_SECONDS=${HERMES_RETRY_BACKOFF_SECONDS:-2}
      - HERMES_PROVIDER=${HERMES_PROVIDER:-openai_compatible}
      - HERMES_REQUEST_FORMAT=${HERMES_REQUEST_FORMAT:-native}
      - HERMES_MODEL=${HERMES_MODEL:-}
      - AGENT_RUNNER_ARTIFACT_DIR=${AGENT_RUNNER_ARTIFACT_DIR:-/app/data/agent-runs}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ../../data:/app/data
      - ../../core:/app/core:ro
      - ../../AGENTS.md:/app/AGENTS.md:ro
    ports:
      - "127.0.0.1:8095:8095"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8095/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  webhook-gateway:
    <<: *common
    build:
      context: ../../services/webhook-gateway
      dockerfile: Dockerfile
    container_name: aicc-webhook-gateway
    profiles: [core]
    environment:
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    ports:
      - "127.0.0.1:8093:8093"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8093/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  observer:
    <<: *common
    build:
      context: ../../services/observer
      dockerfile: Dockerfile
    container_name: aicc-observer
    profiles: [core]
    environment:
      - MOBILE_GATEWAY_URL=http://mobile-gateway:8088
      - RAG_API_URL=http://rag-api:8090
      - TTO_API_URL=http://tto-api:8091
      - RTK_BRIDGE_URL=http://rtk-bridge:8092
      - WEBHOOK_GATEWAY_URL=http://webhook-gateway:8093
      - WORKER_URL=http://worker:8095
      - QDRANT_URL=http://qdrant:6333
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    ports:
      - "127.0.0.1:8094:8094"
    depends_on:
      - mobile-gateway
      - tto-api
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8094/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  web-dashboard:
    <<: *common
    image: nginx:alpine
    container_name: aicc-web-dashboard
    profiles: [core]
    volumes:
      - ../../apps/web/.output/public:/usr/share/nginx/html:ro
      - ../nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:3000:80"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:80/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ─── Optional: Automation ─────────────────────────────────────────────────

  activepieces:
    <<: *common
    image: activepieces/activepieces:latest
    container_name: aicc-activepieces
    profiles: [automation]
    environment:
      - AP_ENCRYPTION_KEY=${AP_ENCRYPTION_KEY:-change_me}
      - AP_JWT_SECRET=${AP_JWT_SECRET:-change_me}
      - AP_DB_TYPE=POSTGRES
      - AP_POSTGRES_DATABASE=${POSTGRES_DB:-aicc}
      - AP_POSTGRES_USERNAME=${POSTGRES_USER:-aicc_user}
      - AP_POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-change_me}
      - AP_POSTGRES_HOST=postgres
      - AP_POSTGRES_PORT=5432
      - AP_REDIS_URL=redis://:${REDIS_PASSWORD:-change_me}@redis:6379
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ─── Optional: AlmaLinux 8 Compatibility Check ────────────────────────────

  alma8-check:
    image: almalinux:8-minimal
    container_name: aicc-alma8-check
    profiles: [alma8]
    networks:
      - ai_net
    volumes:
      - ../../scripts:/scripts:ro
    command: >
      sh -c "
        echo '=== AlmaLinux 8 Compatibility Check ===' &&
        cat /etc/os-release &&
        echo '=== curl test ===' &&
        curl --version 2>/dev/null || echo 'curl not available' &&
        echo '=== Python test ===' &&
        python3 --version 2>/dev/null || python --version 2>/dev/null || echo 'python not available' &&
        echo '=== Done ==='
      "

  # ─── Optional: Research Sandbox ───────────────────────────────────────────

  research-sandbox:
    image: python:3.11-slim
    container_name: aicc-research-sandbox
    profiles: [research]
    networks:
      - ai_net
    volumes:
      - ../../docs/research:/research
    environment:
      - SANDBOX=true
    command: >
      sh -c "
        pip install --quiet jupyter notebook ipykernel 2>/dev/null &&
        echo 'Research sandbox ready. Docs at /research' &&
        tail -f /dev/null
      "
